[package]
name = "horsies-test-worker"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Test worker binary with e2e tasks registered for integration/e2e tests"
publish = false

[[bin]]
name = "horsies-test-worker"
path = "src/main.rs"

[dependencies]
horsies = { path = "../../horsies" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
gethostname = "0.4"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
horsies-test-support = { path = "../support" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
serial_test = "3"
tempfile = "3"

[lints]
workspace = true
