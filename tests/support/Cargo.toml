[package]
name = "horsies-test-support"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Shared test infrastructure for horsies integration and e2e tests"
publish = false

[dependencies]
horsies = { path = "../../horsies" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
libc = "0.2"

[dev-dependencies]
serial_test = "3"

[lints]
workspace = true
