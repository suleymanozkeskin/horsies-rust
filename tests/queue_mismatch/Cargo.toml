[package]
name = "horsies-queue-mismatch-tests"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Queue/task mismatch guard verification — 6 scenarios matching Python test_queue_mismatch_guard.py"
publish = false

[dependencies]
horsies = { path = "../../horsies" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
