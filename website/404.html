<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Horsies Rust docs moved</title>
<meta name="robots" content="noindex">
<script>
(function () {
  var oldBase = "/horsies-rust/";
  var newBase = "/horsies/rust/";
  var path = location.pathname;
  var rest = path.indexOf(oldBase) === 0 ? path.slice(oldBase.length) : "";
  location.replace(newBase + rest + location.search + location.hash);
})();
</script>
</head>
<body>
<p>The Horsies Rust docs moved to the Horsies docs site.</p>
<p>Go to <a href="https://suleymanozkeskin.github.io/horsies/rust/">https://suleymanozkeskin.github.io/horsies/rust/</a>.</p>
</body>
