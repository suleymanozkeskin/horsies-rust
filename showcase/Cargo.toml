[package]
name = "acme-showcase"
version = "0.1.0-alpha.27"
edition = "2021"
publish = false
description = "Acme Clothing showcase for horsies"
license = "MIT"
repository = "https://github.com/suleymanozkeskin/horsies-rust"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
horsies = { path = "../horsies", version = "0.1.0-alpha.27" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true

[[bin]]
name = "acme"
path = "src/main.rs"
